[ai]
provider = "ollama"
models = ["gemma4:e4b", "qwen2.5-coder:14b", "gemma4:12b-mlx"]
endpoint = "http://localhost:11434/api/generate"
max_input_tokens = 2048
context_window_tokens = 16384
max_output_tokens = 512
temperature = 0.1
timeout_seconds = 180

[documentation]
selection = "repository"
coverage = "all"
existing_docs = "preserve"
language = "pt-BR"
python_format = "google"
javascript_format = "jsdoc"
output = "apply"
confirm = false

[limits]
max_files_per_request = 50
max_file_bytes = 100000
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/*.min.js", "**/package-lock.json", "*.md", "*.toml", "CNAME", "Makefile", "LICENSE", ".venv"]
