[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-gub"
dynamic = ["version"]
description = "Generate and safely apply AI-assisted source documentation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["documentation", "docstrings", "developer-tools", "generative-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://argolo.dev"
Documentation = "https://argolo.dev"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "commitar>=1.0.0,<2",
    "setuptools>=83,<84",
]

[project.scripts]
doc-gub = "doc_gub.cli:main"

[tool.setuptools.dynamic]
version = {attr = "doc_gub.__version__"}

[tool.setuptools.packages.find]
include = ["doc_gub*"]
namespaces = false

[tool.setuptools.package-data]
doc_gub = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers --cov=doc_gub --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["doc_gub"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "UP", "D"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["doc_gub"]

[tool.ruff.lint.per-file-ignores]
"example/funcoes_classicas.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = true
