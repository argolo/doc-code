[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-gub"
version = "0.1.0"
description = "Secure AI-assisted source documentation generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]
license = "MIT"

[project.urls]
Homepage = "https://argolo.dev"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "commitar>=1.0.0",
]

[project.scripts]
commitar = "commitar.cli:main"
doc-gub = "doc_gub.cli:main"

[tool.setuptools.packages.find]
include = ["commitar*", "doc_gub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
