[ai]
provider = "ollama"
models = ["gemma4:e4b", "qwen2.5-coder:14b", "gemma4:12b-mlx"]
endpoint = "http://localhost:11434/api/generate"
max_input_tokens = 3000
context_window_tokens = 8192
max_output_tokens = 100
temperature = 0.2
timeout_seconds = 60

[commit]
language = "pt-BR"
format = "conventional"
include_added = true
output = "commit"
confirm = false

[limits]
max_files_per_request = 10
max_diff_bytes = 10000
